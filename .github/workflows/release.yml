name: Release

# Pushing a tag vX.Y.Z (matching package.json) runs every check, stages the version on npm
# with provenance, and creates a draft GitHub release from that version's CHANGELOG.md entry.
# A maintainer then approves the staged version with 2FA (npmjs.com, or
# `npm stage approve <id> --otp=<code>`), which makes it public, and publishes the draft.
# A manual run does everything except staging and the release: `npm publish --dry-run`.
#
# npm authentication: trusted publishing (OIDC; package settings on npmjs.com: repository
# digitalemagine/noisefloor, workflow release.yml, environment npm, direct publish not allowed),
# so no token is stored. Provenance needs a public repository.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Check, stage on npm, draft GitHub release
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26 # npm 11: trusted publishing needs 11.5.1 or later
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Tag matches package.json version
        if: github.ref_type == 'tag'
        run: |
          v="v$(node -p "require('./package.json').version")"
          [ "$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match package.json $v"; exit 1; }
      # Same checks as ci.yml.
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:package
      - run: npm run build:site
      - run: node scripts/smoke.mjs
      - run: node scripts/fidelity.mjs
      - name: Release notes from CHANGELOG.md
        run: |
          version="$(node -p "require('./package.json').version")"
          awk -v v="$version" '$0 ~ "^## " v "( |$)" { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || { echo "CHANGELOG.md has no entry for $version"; exit 1; }
          cat "$RUNNER_TEMP/notes.md"
      - name: Stage on npm (approve with 2FA to publish)
        if: github.ref_type == 'tag'
        run: npm stage publish --provenance --access public
      - name: Publish to npm (dry run)
        if: github.ref_type != 'tag'
        run: npm publish --dry-run --access public
      - name: GitHub release (draft until the npm version is approved)
        if: github.ref_type == 'tag'
        run: gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
